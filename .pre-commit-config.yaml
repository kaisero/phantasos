# Pre-commit hooks for phantasos.
# Install with: uv run pre-commit install
# Run on all files: uv run pre-commit run --all-files
#
# Dependabot has no pre-commit ecosystem, so hook versions are kept current by
# pre-commit.ci (https://pre-commit.ci) via the `ci:` block below. Enable it for
# the repo, or run `uv run pre-commit autoupdate` periodically by hand.
ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: pre-commit autoupdate"

default_language_version:
  python: python3.11

repos:
  # Secrets scanning: block hardcoded credentials/API keys from being committed.
  # Scans only the staged diff (--staged), so it's fast on every commit. CI runs
  # a full-history sweep as the backstop (a hook can be bypassed with --no-verify).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Enforce block-style YAML in self-authored product config files (no inline
  # `{a: b}` / `[a, b]`). Scoped by `files:` to products/*/sdk.yml and
  # products/*/cli.yml ONLY — the hand-imported OpenAPI specs are never linted.
  # Rules live in .yamllint (braces/brackets forbid: non-empty).
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint, --strict]
        files: ^products/[^/]+/(sdk|cli)\.yml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # mypy type-checks src/ and tests/ in this isolated hook env, so it
        # needs the imports those resolve. Intentionally UNPINNED: pyproject.toml
        # is the single source of version truth, so there are no duplicated
        # version specifiers here to drift out of sync with it.
        additional_dependencies:
          - pytest
        pass_filenames: false
        args: []

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.18
    hooks:
      - id: uv-lock
