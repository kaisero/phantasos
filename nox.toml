# nox.toml — product enrollment for phantasos's product-parametrized nox sessions.
#
# Each stage lists the products it builds/gates. Add a product to a stage's
# `products` list once it is ready to be part of that stage's pipeline; the
# noxfile reads this file (stdlib `tomllib`) and runs the stage generically over
# its products — NO product name is hardcoded in noxfile.py.
#
#   smoke    — build each SDK end-to-end (generate -> vendor -> smoke).
#   live     — build the SDK + run its live CRUD suite (real tenant; skips w/o creds).
#   sdk-docs — build the SDK + its docs and run `mkdocs build --strict`.
#
# (phantasos's OWN site is the separate `docs`/`docs-serve` sessions and is not
# governed here.)

[smoke]
products = ["prisma-browser", "adem"]

[live]
products = ["prisma-browser", "prisma-access"]

[sdk-docs]
products = ["prisma-browser", "prisma-access"]

# Optional per-product fidelity assertions for `sdk-docs`. The generic check
# (build --strict + `mkdocs build --strict` exit 0 + a rendered `reference/`)
# runs for EVERY enrolled product; these add product-specific content guards.
# `file` is relative to the built SDK's `site/` dir; give `contains` xor
# `not_contains`. A product with no entries here is covered by the generic check
# only.
[[sdk-docs.assert]]
product = "prisma-browser"
file = "reference/models/custom_application_input/index.html"
contains = "Name of the application"          # griffe-pydantic renders field descriptions

[[sdk-docs.assert]]
product = "prisma-browser"
file = "reference/models/create_or_replace_app_input/index.html"
contains = "CustomApplicationInput"           # oneOf wrapper page links its variants

[[sdk-docs.assert]]
product = "prisma-browser"
file = "guides/crud/index.html"
contains = "Acme Wiki"                         # curated CRUD example body rendered

[[sdk-docs.assert]]
product = "prisma-browser"
file = "guides/crud/index.html"
not_contains = "CreateOrReplaceAppInput(...)"  # not the opaque oneOf placeholder

# prisma-access is FEDERATED: gen_ref_pages loops `_SUBPACKAGES` and groups every
# wrapper + model page under `reference/<slug>/…`. Material's search plugin records
# one `"location": "reference/<slug>/…/"` per rendered page in search_index.json, so
# asserting the slug prefix there proves ≥1 reference page exists for that sub-package
# (the federation marker — a single-spec layout would have a flat `reference/…`).
[[sdk-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/objects/"               # showcase sub (address wrapper)

[[sdk-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/network_services/"      # 2nd federated sub renders

[[sdk-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/ztna_connector/"        # 3rd federated sub renders

[cli-docs]
products = ["prisma-browser", "prisma-access"]
# adem: PENDING — its 13 ops are all non-CRUD telemetry GETs, so `cli build` emits 0
# commands (no documentable surface). Enroll once those ops are request-mapped in cli.yml.

# Per-product content guards (relative to the built CLI's site/ dir; use_directory_urls).
[[cli-docs.assert]]
product = "prisma-browser"
file = "index.html"
contains = "Command model"

[[cli-docs.assert]]
product = "prisma-browser"
file = "reference/application/index.html"
contains = "show application"          # lean per-command heading

# prisma-access is FEDERATED: the CLI docs group every per-object reference page under
# reference/<slug>/… (one folder + nav section per sub-package), mirroring the federated
# SDK docs. Material's search plugin records one "location": "reference/<slug>/…/" per
# rendered page in search_index.json, so asserting the slug prefix there proves ≥1
# reference page renders per sub-package (the federation marker — a single-spec layout
# would have a flat reference/…). Mirrors the [[sdk-docs.assert]] prisma-access entries.
[[cli-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/objects/"               # showcase sub (address CRUD)

[[cli-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/network_services/"      # 2nd federated sub renders

[[cli-docs.assert]]
product = "prisma-access"
file = "search/search_index.json"
contains = "reference/ztna_connector/"        # 3rd federated sub renders
