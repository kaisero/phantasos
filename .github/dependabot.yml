version: 2
# Note: the "uv" ecosystem requires a committed uv.lock to produce updates.
# Also enable "Dependabot security updates" in the repo settings — version
# updates below are not the same as security (CVE) alerts.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Without this, Dependabot opens against the default branch (main).
    # Integration happens on develop, so that is where updates belong.
    target-branch: "develop"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Without this, Dependabot opens against the default branch (main).
    # Integration happens on develop, so that is where updates belong.
    target-branch: "develop"
    groups:
      github-actions:
        patterns: ["*"]
