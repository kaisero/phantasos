version: 2
# Note: the "uv" ecosystem requires a committed uv.lock to produce updates.
# Also enable "Dependabot security updates" in the repo settings — version
# updates below are not the same as security (CVE) alerts.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
