name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Runs BEFORE any `uv run` — a plain `uv run` would silently refresh the
      # lock first and mask drift. `uv lock --check` fails if uv.lock is stale.
      - name: Lock file up to date
        run: uv lock --check
      - name: Lint
        run: uv run nox -s lint
      - name: Type-check
        run: uv run nox -s type_check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run nox -s tests-${{ matrix.python-version }}

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Build (strict)
        run: uv run nox -s docs

  cli-smoke:
    name: CLI isolated-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Generates a CLI, installs it into a CLEAN venv (its declared deps only —
      # typer resolves to the slim core, no top-level click) and runs it. Catches
      # undeclared-dependency / import / run regressions the dev-venv tests cannot.
      - name: Generate -> install -> run a CLI in a clean venv
        run: uv run nox -s cli-smoke

  smoke:
    name: Build smoke + ring-3 real-artifact tests (auto-provisioned Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Caches both the OAG jar and the auto-provisioned Temurin JRE so the
      # one-time downloads are reused across runs. NO actions/setup-java — the
      # point of this job is to prove phantasos provisions Java itself.
      - name: Cache OAG jar + Temurin JRE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/phantasos
          key: phantasos-toolchain-oag7.22.0-jre17.0.19-smokeenv1
      # Builds every [smoke] SDK, then runs `pytest -m real_sdk` against them — the
      # only CI place the ring-3 real-artifact tests execute (the matrix `tests` job
      # builds no SDK). Catches emitted-shape drift (e.g. an OAG bump) that the
      # fakesdk-fixture tests structurally cannot see.
      - name: Build example SDKs + run ring-3 tests (Java auto-provisioned)
        run: uv run nox -s smoke

  sdk-docs:
    name: SDK docs (strict, auto-provisioned Java)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # sdk-docs builds each enrolled SDK (OAG) then its docs + mkdocs site and runs
      # the nox.toml [[sdk-docs.assert]] fidelity guards (the "docs show payload, not
      # scaffolding" invariant). Reuse the same OAG jar + Temurin JRE cache.
      - name: Cache OAG jar + Temurin JRE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/phantasos
          key: phantasos-toolchain-oag7.22.0-jre17.0.19-smokeenv1
      - name: Build each enrolled SDK + docs (strict)
        run: uv run nox -s sdk-docs

  cli-docs:
    name: CLI docs (strict, auto-provisioned Java)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # cli-docs builds each enrolled SDK (OAG) then its CLI + mkdocs site; reuse the
      # same auto-provisioned OAG jar + Temurin JRE cache as the smoke job.
      - name: Cache OAG jar + Temurin JRE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/phantasos
          key: phantasos-toolchain-oag7.22.0-jre17.0.19-smokeenv1
      - name: Build each enrolled CLI + docs (strict)
        run: uv run nox -s cli-docs
