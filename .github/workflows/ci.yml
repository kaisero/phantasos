name: ci
on:
  push:
    branches: [main, migrate/openapi-generator-python]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build SDK
        run: make build
      - name: Test
        run: make test
