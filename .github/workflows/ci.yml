name: ci
on:
  push:
    branches: [main, rearch/sdkgen]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install sdkgen
        run: uv pip install --system -e ".[generated,dev]"
      - name: Framework engine tests
        run: python -m pytest tests/ -q
      - name: Smoke-build the example spec
        run: sdkgen build specs/prisma-browser/sdk.py
