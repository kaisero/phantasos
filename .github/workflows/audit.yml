name: Audit

# Dependency vulnerability scanning (CodeQL covers first-party code; this covers
# the dependency tree). Runs on a schedule so newly-disclosed CVEs in already-
# pinned dependencies are caught even without code changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Audit dependencies
        run: uv run nox -s audit
        # A newly-disclosed CVE in a transitive dep shouldn't red-X unrelated
        # PRs. The scheduled run, push-to-main, and Dependabot stay the hard
        # gate; PR runs surface findings without blocking the merge.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
