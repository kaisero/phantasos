site_name: phantasos
site_description: Generate native, self-contained Python SDKs and CLIs from OpenAPI specs.
site_url: https://kaisero.github.io/phantasos/
repo_url: https://github.com/kaisero/phantasos
repo_name: kaisero/phantasos
copyright: Copyright &copy; 2026 Oliver Kaiser

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Authoring a product: authoring.md
  - CLI reference: cli-reference.md

# Internal/historical markdown kept in the repo but excluded from the published site:
# the prototype phase write-ups, the migration index/plan, and planning docs.
exclude_docs: |
  specs/
  plans/
  TODO.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
