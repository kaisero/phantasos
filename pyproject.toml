[project]
name = "phantasos"
version = "0.1.0"
description = "Generate native, self-contained Python SDKs from OpenAPI specs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Kaiser", email = "oliver.kaiser@outlook.com" }]
keywords = ["openapi", "sdk", "codegen", "openapi-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/kaisero/phantasos"
Documentation = "https://kaisero.github.io/phantasos/"
Repository = "https://github.com/kaisero/phantasos"
Issues = "https://github.com/kaisero/phantasos/issues"
Changelog = "https://github.com/kaisero/phantasos/blob/main/CHANGELOG.md"

[project.scripts]
phantasos = "phantasos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantasos"]
# Ship the Jinja component templates as package data (vendored at build time).
artifacts = [
    "src/phantasos/components/**/*.jinja",
    "src/phantasos/scaffold/**",
]

[tool.hatch.build.targets.sdist]
include = ["src/phantasos", "README.md"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
typecheck = ["mypy>=1.11", { include-group = "test" }]
lint = ["ruff>=0.6", "codespell>=2.3"]
audit = ["pip-audit>=2.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "nox>=2024.4",
    "pre-commit>=3.7",
    "typer>=0.26.7",
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "lint" },
    { include-group = "audit" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "transformations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "ASYNC", "PTH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
# fixture intentionally mirrors OpenAPI-Generator output (old-style annotations)
"tests/fixtures/**" = ["UP042", "UP045", "UP007"]
# generate.py runs the pinned OpenAPI Generator jar via subprocess — trusted argv.
"src/phantasos/generate.py" = ["S603"]
# provision.py fetches the pinned, checksum-verified jar/JRE over https — trusted.
"src/phantasos/provision.py" = ["S310"]
# smoke.py shells out to the isolated venv's python/pip — trusted argv.
"src/phantasos/smoke.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["phantasos"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ruamel", "ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["phantasos"]
# generate.py is a thin subprocess wrapper around the OpenAPI Generator jar; it is
# exercised by `nox -s smoke` (which needs Java), not the unit suite.
omit = ["src/phantasos/generate.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.codespell]
skip = "*.lock,./.git,./.nox,./.venv,./site,./specs,./docs/phase-*.md"
