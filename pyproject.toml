[project]
name = "phantasos"
version = "0.1.0a1"
description = "Generate native, self-contained Python SDKs and CLIs from OpenAPI specs."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Kaiser", email = "oliver.kaiser@outlook.com" }]
keywords = ["openapi", "sdk", "codegen", "openapi-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "pydantic>=2",
    "jmespath>=1.0",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/kaisero/phantasos"
Documentation = "https://kaisero.github.io/phantasos/"
Repository = "https://github.com/kaisero/phantasos"
Issues = "https://github.com/kaisero/phantasos/issues"
Changelog = "https://github.com/kaisero/phantasos/blob/main/CHANGELOG.md"

[project.scripts]
phantasos = "phantasos.cli:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI readme: README.md with the HTML logo block (which PyPI's renderer strips)
# replaced by a plain "# Phantasos" header. Single source of truth: README.md.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "# Phantasos\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-after = "<!-- pypi-readme-start -->\n"

[tool.hatch.build.targets.wheel]
packages = ["src/phantasos"]
# Ship the Jinja component + CLI templates as package data (read at runtime via
# importlib/Path from the installed package; the wheel omits non-.py files otherwise).
artifacts = [
    "src/phantasos/generator/sdk/components/**/*.jinja",
    "src/phantasos/generator/cli/templates/**",
    "src/phantasos/generator/cli/cli_overrides/**",
    "src/phantasos/scaffold/**",
    "src/phantasos/generator/sdk/oag_templates/**",
]

[tool.hatch.build.targets.sdist]
include = ["src/phantasos", "README.md"]

[dependency-groups]
# python-dotenv + pyyaml: the emitted-CLI tests import a generated CLI in-process,
# which imports yaml/dotenv at module load — both must be present in the test env.
test = ["pytest>=8", "pytest-cov>=5", "python-dotenv>=1.0", "pyyaml>=6"]
typecheck = ["mypy>=1.11", { include-group = "test" }]
lint = ["ruff>=0.6", "codespell>=2.3"]
audit = ["pip-audit>=2.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "nox>=2024.4",
    "pre-commit>=3.7",
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "lint" },
    { include-group = "audit" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "tools", "transformations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "ASYNC", "PTH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
# fixture intentionally mirrors OpenAPI-Generator output (old-style annotations)
"tests/fixtures/**" = ["UP042", "UP045", "UP007"]
# generate.py runs the pinned OpenAPI Generator jar via subprocess — trusted argv.
"src/phantasos/generator/sdk/generate.py" = ["S603"]
# render_cli.py runs the trusted `ruff` binary to format the code it just emitted.
"src/phantasos/generator/cli/render_cli.py" = ["S603"]
# provision.py fetches the pinned, checksum-verified jar/JRE over https — trusted.
"src/phantasos/generator/sdk/provision.py" = ["S310"]
# smoke.py shells out to the isolated venv's python/pip — trusted argv.
"src/phantasos/generator/sdk/smoke.py" = ["S603"]
# cli_isolated_smoke.py shells out to `uv`/the clean venv's python — trusted argv.
"tests/cli_isolated_smoke.py" = ["S603", "S607"]
# The quality-harness hooks run trusted argv (git + the gate command from the
# protected .claude/harness.toml); their tests subprocess the hooks themselves.
".claude/hooks/*.py" = ["S603", "S607"]
"tests/test_harness_hooks.py" = ["S603", "S607"]
# ab_eval/run.py shells out to the trusted `claude` CLI binary — argv is fixed.
"tools/ab_eval/run.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["phantasos"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests", "tools"]
# Fixtures deliberately mirror OpenAPI-Generator output (untyped); they are not
# code-under-test, so keep them out of strict analysis (ruff special-cases them too).
exclude = ['^tests/fixtures/']

[[tool.mypy.overrides]]
module = ["ruamel", "ruamel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jmespath", "jmespath.*"]
ignore_missing_imports = true

# The fakesdk fixture is excluded from analysis (above); its symbols are imported
# by a couple of tests, so resolve those import sites to Any.
[[tool.mypy.overrides]]
module = ["fakesdk", "fakesdk.*"]
ignore_missing_imports = true

# PyYAML ships no type stubs; the emitted-CLI tests use it trivially (safe_load).
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# prisma_browser is a GENERATED SDK, absent at type-check time (built by `nox -s smoke`);
# the real-SDK tests import it inside skip-guarded bodies.
[[tool.mypy.overrides]]
module = ["prisma_browser", "prisma_browser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["phantasos"]
# generate.py is a thin subprocess wrapper around the OpenAPI Generator jar; it is
# exercised by `nox -s smoke` (which needs Java), not the unit suite.
omit = ["src/phantasos/generator/sdk/generate.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.codespell]
skip = "*.lock,./.git,./.nox,./.venv,./site,./specs,./docs/phase-*.md"
