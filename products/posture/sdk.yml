package: posture
output: ../../../posture-sdk
base_url: https://api.strata.paloaltonetworks.com
auth:
  type: scm_oauth
  scope_env: SCOPE
  base_url_env: POSTURE_BASE_URL
  config_class_name: PostureConfiguration
pagination: {type: offset}
errors: {type: list_error}
facade: true
hooks: ./hooks.py
# Opt-in user docs (mkdocs), tailored to the `posture_check` wrapper object. The
# guides teach the wrapper surface `client.posture_check.<verb>(...)`. posture_check
# exposes create/get/list/delete on the wrapper (its full-replace PUT routes to
# `.replace`, not a CRUD `update` slot), so the CRUD guide renders four slots — the
# partial-CRUD path. The `examples.create` override supplies a domain-rich body.
docs:
  showcase_resource: posture_check
  examples:
    create: |
      created = client.posture_check.create(
          body=PostureCheckCreateRequest(
              name="Security Rule has logging enabled",
              object_type="security_rule",
              severity="High",
              data={
                  "operator": "and",
                  "conditions": [{"field": "log-setting", "operator": "is-not-empty"}],
              },
          ),
      )

# --- SDK op suppression ---
# `initiate_config_upload` is a None-classified anchorless op (a BPA config upload
# that initiates a multipart file upload) with no CRUD object to attach to on its
# api class — without an override the wrapper-context build FAILS. It is handled by
# the `request bpa upload` CLI command (cli.yml), so the SDK suppresses it from the
# typed wrapper surface here (SDK analog of `cli.yml hide:`).
operations:
  config_file_upload.initiate_config_upload: {hide: true}

project:
  distribution: posture-sdk
  description: Python SDK for the Palo Alto Networks Posture Management & Assessment APIs
  author: Oliver Kaiser
  author_email: oliver.kaiser@outlook.com
  repo_url: https://github.com/kaisero/posture-sdk
