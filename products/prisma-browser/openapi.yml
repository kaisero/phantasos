        - securityRule
        - customizationRule
        - signInRule
        - accessAndDataSection
        - securitySection
        - customizationSection
        - signInSection
        - deviceGroup
        - applicationGroup
        - customApplication
        - privateApplication
        - praApplication
        - nonwebApplication
        - localDesktopApplication
        - catalogApplication
        - localDesktopCatalogApplication
        - tag
        - localUserGroup
