          type: string
          minLength: 1
          maxLength: 100
          description: Company logo asset identifier. Set `companyLogoId` to the value returned by POST /assets/company-logo.
    CompanyLogoUploadResponse:
      type: object
      required:
        - companyLogoId
      properties:
        companyLogoId:
          type: string
