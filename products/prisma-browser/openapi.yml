openapi: 3.0.0
info:
  title: Prisma Browser Management Console Public API
  description: This Open API spec file represents the APIs available for Palo Alto Networks Prisma Browser Management APIs. These APIs are available for all Prisma Browser tenants to scale and automate their processes related to the browser. All of the functionality exposed by these APIs can also be performed using the Prisma Browser User Interface. These APIs use the common SASE authentication mechanism and base URL. See the Prisma SASE API Get Started guide for more information. © 2026 Palo Alto Networks, Inc. Palo Alto Networks is a registered trademark of Palo Alto Networks. A list of our trademarks can be found at https://www.paloaltonetworks.com/company/trademarks.html. All other marks mentioned herein may be trademarks of their respective companies.
  version: 1.0.0
servers:
  - url: https://api.sase.paloaltonetworks.com
security:
  - BearerAuth: []
paths:
  /seb-api/v1/users:
    get:
      operationId: ListUsers
      tags:
        - Users
      summary: Returns a list of users
      parameters:
        - $ref: '#/components/parameters/includeTotalCountParameter'
        - name: limit
          in: query
          description: Number of users to return
          required: false
          schema:
            type: integer
            format: int32
        - name: includeDeleted
          in: query
          description: Include deleted users
          required: false
          schema:
            type: boolean
        - name: user.name
          in: query
          description: Filter by user name
          required: false
          schema:
            type: string
        - name: user.email
          in: query
          description: Filter by user email
          required: false
          schema:
            type: string
        - name: user.first_seen_gte
          in: query
          description: Filter by first seen time or after
          required: false
          schema:
            type: string
            format: date-time
        - name: user.last_seen_lte
          in: query
          description: Filter by last seen time or before
          required: false
          schema:
            type: string
            format: date-time
        - name: user.status
          in: query
          description: Filter by user status
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: groupId
          in: query
          description: Filter by user group ID. Supports comma-separated values to filter by multiple groups (e.g. groupId=id1,id2,id3).
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          description: An optional opaque string that defines from where to start listing
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: The field to sort by
          required: false
          schema:
            type: string
            enum:
              - user.name
              - user.email
              - user.first_seen
              - user.last_seen
              - user.status
        - name: order
          in: query
          description: The sort order
          required: false
          schema:
            $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: A list of users with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /seb-api/v1/users/{id}:
    get:
      operationId: GetUserByID
      tags:
        - Users
      summary: Returns a user by ID
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
  /seb-api/v1/users/suspend:
    post:
      operationId: SuspendUsers
      tags:
        - Users
      summary: Suspend users
      description: Suspend one or more users by changing their status to suspended. Suspended users will lose access to the browser from all of their known or future devices, except from their Prisma Browser Extension and mobile devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChangeRequest'
      responses:
        '200':
          description: Users suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuspendResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/users/resume:
    post:
      operationId: ResumeUsers
      tags:
        - Users
      summary: Resume suspended users
      description: Resume one or more suspended users by changing their status to active. Resumed users will regain access to the browser from all of their known or future devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChangeRequest'
      responses:
        '200':
          description: Users resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResumeResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/users/force-reauth:
    post:
      operationId: ForceReauthUsers
      tags:
        - Users
      summary: Force re-authentication for users
      description: Force re-authentication on all active devices for one or more users. Upon execution, targeted users will be required to re-authenticate to the browser on all of their devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChangeRequest'
      responses:
        '200':
          description: Force re-authentication initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserForceReauthResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices:
    get:
      operationId: ListDevices
      tags:
        - Devices
      summary: Returns a list of devices
      parameters:
        - $ref: '#/components/parameters/includeTotalCountParameter'
        - name: limit
          in: query
          description: Number of devices to return
          required: false
          schema:
            type: integer
            format: int32
        - name: device.hostname
          in: query
          description: Filter by hostname
          required: false
          schema:
            type: string
        - name: user.name
          in: query
          description: Filter by user name
          required: false
          schema:
            type: string
        - name: device.os_type
          in: query
          description: Filter by OS type
          required: false
          schema:
            type: string
        - name: device.first_seen_gte
          in: query
          description: Filter by first seen time or after
          required: false
          schema:
            type: string
            format: date-time
        - name: device.last_seen_lte
          in: query
          description: Filter by last seen time or before
          required: false
          schema:
            type: string
            format: date-time
        - name: device.last_seen_gte
          in: query
          description: Filter by last seen time or after
          required: false
          schema:
            type: string
            format: date-time
        - name: device.type
          in: query
          description: Filter by device type
          required: false
          schema:
            type: string
        - name: device.firewall_status
          in: query
          description: Filter by firewall status
          required: false
          schema:
            type: string
        - name: device.screen_lock_status
          in: query
          description: Filter by screen lock status
          required: false
          schema:
            type: string
        - name: device.disk_encryption_status
          in: query
          description: Filter by disk encryption status
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          description: An optional opaque string that defines from where to start listing
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: The field to sort by
          required: false
          schema:
            type: string
            enum:
              - device.hostname
              - device.os_type
              - device.browser_version
              - device.first_seen
              - device.last_seen
              - user.name
        - name: order
          in: query
          description: The sort order
          required: false
          schema:
            $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: A list of devices with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /seb-api/v1/devices/{id}:
    get:
      operationId: GetDeviceByID
      tags:
        - Devices
      summary: Returns a device by ID
      parameters:
        - name: id
          in: path
          description: Device ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Device not found
  /seb-api/v1/devices/archive:
    post:
      operationId: ArchiveDevices
      tags:
        - Devices
      summary: Archive devices
      description: Archive one or more devices by changing their status to archived
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Devices archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceArchiveResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices/restore:
    post:
      operationId: RestoreDevices
      tags:
        - Devices
      summary: Restore archived devices
      description: Restore one or more archived devices by changing their status to active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Devices restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRestoreResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices/suspend:
    post:
      operationId: SuspendDevices
      tags:
        - Devices
      summary: Suspend devices
      description: Suspend one or more devices by changing their status to suspended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Devices suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSuspendResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices/resume:
    post:
      operationId: ResumeDevices
      tags:
        - Devices
      summary: Resume suspended devices
      description: Resume one or more suspended devices by changing their status to active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Devices resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResumeResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices/delete:
    post:
      operationId: DeleteDevices
      tags:
        - Devices
      summary: Delete devices
      description: Delete one or more devices permanently. Suspended devices cannot be deleted - they must be resumed first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Devices deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDeleteResponse'
        '400':
          description: Bad request - invalid input or attempting to delete suspended devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/devices/force-reauth:
    post:
      operationId: ForceReauthDevices
      tags:
        - Devices
      summary: Force re-authentication for devices
      description: Force re-authentication on one or more specific devices. Upon execution, targeted devices will require their user to re-authenticate to the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Force re-authentication initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceForceReauthResponse'
        '400':
          description: Bad request - invalid input or too many devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: One or more devices not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
  /seb-api/v1/user-groups:
    get:
      operationId: ListUserGroups
      tags:
        - User Groups
      summary: Returns a list of user groups
      parameters:
        - $ref: '#/components/parameters/includeTotalCountParameter'
        - name: limit
          in: query
          description: Number of user requests to return
          required: false
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: An optional opaque string that defines from where to start listing
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of user groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroup'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    post:
      operationId: CreateUserGroup
      tags:
        - User Groups
      summary: Creates a new user group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the user group
                userIds:
                  type: array
                  items:
                    type: string
                  description: List of user IDs
              required:
                - name
                - userIds
      responses:
        '201':
          description: User group created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the newly created user group
                  userGroupId:
                    type: string
                    description: 'Deprecated: use `id` instead. The ID of the newly created user group.'
                    deprecated: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /seb-api/v1/user-groups/{id}:
    get:
      operationId: GetUserGroupByID
      tags:
        - User Groups
      summary: Returns a single user group by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user group to retrieve
          schema:
            type: string
      responses:
        '200':
          description: A single user group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: User group not found
        '500':
          description: Internal server error
    put:
      operationId: UpdateUserGroup
      tags:
        - User Groups
      summary: Updates a user group
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user group to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                        description: User ID
                      action:
                        type: string
                        enum:
                          - add
                          - remove
                        description: Action to perform (add or remove the user)
                    required:
                      - userId
                      - action
                  description: List of user updates
              required:
                - users
      responses:
        '200':
          description: User group updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the updated user group
                  userGroupId:
                    type: string
                    description: 'Deprecated: use `id` instead. The ID of the updated user group.'
                    deprecated: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: User group not found
        '500':
          description: Internal server error
    delete:
      operationId: DeleteUserGroup
      tags:
        - User Groups
      summary: Deletes a user group
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user group to delete
          schema:
            type: string
      responses:
        '200':
          description: User group deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the deleted user group
                  userGroupId:
                    type: string
                    description: 'Deprecated: use `id` instead. The ID of the deleted user group.'
                    deprecated: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          description: User group not found
        '500':
          description: Internal server error
  /seb-api/v1/applications:
    get:
      operationId: ListApplications
      tags:
        - Applications
      summary: Returns a list of applications
      description: Fetches all application objects, with support for filtering and pagination.
      parameters:
        - $ref: '#/components/parameters/includeTotalCountParameter'
        - in: query
          name: type
          schema:
            type: string
            enum:
              - custom
              - private
              - non-web
              - catalog
              - localdesktopcustom
          required: false
        - $ref: '#/components/parameters/nameParameter'
        - $ref: '#/components/parameters/urlParameter'
        - $ref: '#/components/parameters/includeCatalogAttributesParameter'
        - $ref: '#/components/parameters/limitParameter'
        - $ref: '#/components/parameters/cursorParameter'
        - $ref: '#/components/parameters/applicationSortParameter'
        - $ref: '#/components/parameters/orderParameter'
        - $ref: '#/components/parameters/configurationVersionParameter'
      responses:
        '200':
          description: A list of all application objects
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationItem'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /seb-api/v1/applications/type/{type}:
    get:
      operationId: ListApplicationsByType
      tags:
        - Applications
      summary: Returns a list of applications
      description: Fetches application objects belonging to a specific type.
      parameters:
        - $ref: '#/components/parameters/includeTotalCountParameter'
        - $ref: '#/components/parameters/typeParameter'
        - in: query
          name: name
          schema:
            type: string
          description: Optional name to search in applications
          required: false
        - in: query
          name: url
          schema:
            type: string
          description: Optional URL to search in applications
          required: false
        - $ref: '#/components/parameters/includeCatalogAttributesParameter'
        - $ref: '#/components/parameters/configurationVersionParameter'
        - name: cursor
          in: query
          description: An optional opaque string that defines from where to start listing
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of applications to return
          required: false
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/applicationSortParameter'
        - name: order
          in: query
          description: The sort order
          required: false
          schema:
            $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: A list of all application objects
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationItem'
                  metadata:
                    $ref: '#/components/schemas/ResponseMetadata'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorResponse:
                    $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    post:
      operationId: CreateApplication
      tags:
        - Applications
      summary: Creates an application
      description: |
        Adds a new application of the specified type to the management console.

