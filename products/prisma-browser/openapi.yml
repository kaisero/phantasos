      type: object
      properties:
        any:
          type: boolean
          default: false
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MacOSVersion'
    MaliciousFileProtectionControl:
      type: object
      description: Prevent or detect download or upload of malicious files via Prisma Browser.
      nullable: true
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - enable
            - disable
        detectionAction:
          type: string
          enum:
            - prevent
            - detectOnly
        provider:
          type: string
          enum:
            - crowdStrikeQuickScan
            - savapiScan
            - opswatMetaDefenderCore
            - yazamtech
            - votiro
            - advancedWildFire
        scanConfigurationId:
          type: string
        scanDownloads:
          type: boolean
        scanUploads:
          type: boolean
        blockOnScanError:
          type: boolean
        blockOversizedFiles:
          type: boolean
        blockUnsupportedFileTypes:
          type: boolean
        customDialogText:
          $ref: '#/components/schemas/CustomDialogText'
    ManagedShortcutsControl:
      type: object
      nullable: true
      description: Set the applications that appear on the new tab page and in bookmarks.
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          description: Whether managed shortcuts are configured
          enum:
            - setShortcuts
            - noShortcuts
        shortcuts:
          type: array
          description: |
            Managed shortcuts shown on the new tab page and in bookmarks. Required when mode is setShortcuts. Must not be set when mode is noShortcuts.
            At most 16 entries may have `pinned: true`; requests that exceed this cap are rejected with HTTP 400.
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - url
            properties:
              name:
                type: string
                description: Shortcut display name
                minLength: 1
                maxLength: 256
                pattern: \S
              url:
                type: string
                description: Shortcut destination URL
                minLength: 1
                maxLength: 2048
              shortcutIconId:
                type: string
                description: Shortcut icon asset identifier
                maxLength: 100
              pinned:
                type: boolean
                description: Whether the shortcut is pinned
    ManagementSystemType:
      type: string
      description: Device management system type
      enum:
        - Microsoft Intune
        - Jamf
        - Active Directory
        - Azure AD
    MetadataConfigurationVersion:
      type: object
      nullable: true
      description: Configuration version information
      required:
        - id
        - status
        - number
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Pulid'
          description: Configuration version identifier
        status:
          type: string
          enum:
            - active
            - inactive
            - draft
          description: Configuration version status
        number:
          type: integer
          format: int32
          description: Configuration version number
    MfaRequired:
      type: boolean
      description: Whether the user must complete an MFA challenge before the control's restricted action is allowed. The MFA method (pinCode / identityProvider) is configured globally on the Browser Security Authentication Factor control and is not set per-rule.
      default: false
    Microsoft365TenantCondition:
