          enum:
            - enable
            - enableForSpecificDomains
            - disable
        includedDomains:
          type: array
          description: Domains where extension host permissions are restricted.
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'
    RestrictedRuleMode:
