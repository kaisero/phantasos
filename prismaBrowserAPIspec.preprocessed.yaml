            $ref: '#/components/schemas/PluginEvent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PluginLink'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/PluginElement'
    PluginElement:
      type: object
      properties:
        elementType:
          type: string
          enum:
          - excludeAccountShield
          - includeAccountShield
        urlPattern:
          type: string
        selectors:
          type: array
          items:
            type: string
      required:
      - elementType
      - selectors
    PluginEvent:
      type: object
      properties:
        eventType:
          type: string
          enum:
          - loginFail
          - loginAttempt
          - passwordReset
          - userRegistration
        requestUrl:
          type: string
        triggerUrl:
          type: string
        triggerOnSuccess:
          type: boolean
        triggerOnFail:
          type: boolean
        method:
          type: string
