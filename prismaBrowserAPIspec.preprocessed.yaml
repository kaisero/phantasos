      description: 'Submits the full ordered list of rules and sections for the customization policy. Array index determines position (index 0 = highest priority, evaluated first). All existing rules and sections must be included. Rules in a section must be contiguous.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - positions
              properties:
                positions:
                  type: array
                  minItems: 1
                  description: 'Ordered list of all rules and sections. Array index determines position.

                    '
                  items:
                    $ref: '#/components/schemas/PositionItem'
              additionalProperties: false
      responses:
        '200':
          description: Successfully updated positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsSuccessResponse'
        '400':
          description: Bad request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found - Referenced rule or section does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /seb-api/v1/policy/security/positions:
    put:
      operationId: UpdateSecurityPositions
      tags:
      - Security Policy
      summary: Update rule and section positions in the security policy
      description: 'Submits the full ordered list of rules and sections for the security policy. Array index determines position (index 0 = highest priority, evaluated first). All existing rules and sections must be included. Rules in a section must be contiguous.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - positions
              properties:
                positions:
                  type: array
                  minItems: 1
                  description: 'Ordered list of all rules and sections. Array index determines position.

                    '
                  items:
                    $ref: '#/components/schemas/PositionItem'
              additionalProperties: false
      responses:
        '200':
          description: Successfully updated positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsSuccessResponse'
        '400':
          description: Bad request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found - Referenced rule or section does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: PatchSecurityPositions
      tags:
      - Security Policy
      summary: Apply partial positional changes (moves) to the security policy
      description: 'Submits an ordered list of moves. Each move repositions one rule or section into an

        explicit container (target.sectionId) using a position keyword (top/bottom/before/after)

        plus an optional anchor. Section subjects auto-carry their child rules in the same relative

        order. Default (baseline) rules are pinned at the bottom and cannot be moved or anchored on.

        All moves apply atomically; if any move fails, no DB changes or audit events are produced.

        The failing move''s index is in the error details.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPositionsRequest'
      responses:
        '200':
          description: Successfully applied all moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsSuccessResponse'
        '400':
          description: Bad request - Validation or contiguity error. Details include the failing move index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - Insufficient permissions or endpoint not yet available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found - Referenced subject, anchor, or sectionId does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /seb-api/v1/user-requests:
    get:
      summary: Returns a list of user requests
      parameters:
      - name: limit
        in: query
        description: Number of user requests to return
        required: false
        schema:
          type: integer
          format: int32
      - name: request.type
        in: query
        description: Filter by request type
        required: false
        schema:
          type: string
          enum:
          - WebAccess
          - AppLogin
      - name: request.user_id
        in: query
        description: Filter by request user id
        required: false
        schema:
          type: string
      - name: request.device_id
        in: query
        description: Filter by request device id
        required: false
        schema:
          type: string
      - name: request.rule_id
        in: query
        description: Filter by request rule id
        required: false
        schema:
          type: string
      - name: request.url
        in: query
        description: Filter by request url
        required: false
        schema:
          type: string
      - name: request.responded_by
        in: query
        description: Filter by response by user id
        required: false
        schema:
          type: string
      - name: request.status
        in: query
        description: Filter by request status
        required: false
        schema:
          type: string
          enum:
          - Approved
          - Declined
          - Pending
          - Revoked
      - name: cursor
        in: query
        description: An optional opaque string that defines from where to start listing
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: The field to sort by
        required: false
        schema:
          type: string
          enum:
          - request.created_at
          - request.type
          - request.status
          - request.response_time
          - request.url
      - name: order
        in: query
        description: The sort order
        required: false
        schema:
          $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: A list of requests with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRequest'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: ListUserRequests
      tags:
      - User Requests
  /seb-api/v1/user-requests/{id}:
    get:
      summary: Returns a request by ID
      parameters:
      - name: id
        in: path
        description: Request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequest'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: GetUserRequestByID
      tags:
      - User Requests
  /seb-api/v1/user-requests/{id}/action:
    post:
      summary: Act upon a user request
      parameters:
      - name: id
        in: path
        description: Request ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAction'
      responses:
        '200':
          description: Action performed on request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequest'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: ActionUserRequest
      tags:
      - User Requests
  /seb-api/v1/user-requests/{id}/revoke:
    post:
      summary: Revoke already approved request
      parameters:
      - name: id
        in: path
        description: Request ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequestAction'
      responses:
        '200':
          description: Action performed on request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequest'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: RevokeUserRequest
      tags:
      - User Requests
components:
  parameters:
    configurationVersionParam:
      name: configurationVersion
      in: query
      description: Configuration version to retrieve (draft, active, or version number)
      required: false
      schema:
        type: string
        default: draft
        pattern: ^([dD]raft|[aA]ctive|[1-9][0-9]{0,9}|0CV[0-9A-Z]{26})$
    cursorParameter:
      name: cursor
      in: query
      description: An optional opaque string that defines from where to start listing
      required: false
      schema:
        type: string
    idParameter:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
      description: Application ID.
    limitParameter:
      name: limit
      in: query
      description: Maximum number of applications to return
      required: false
      schema:
        type: integer
        format: int32
    nameParameter:
      in: query
      name: name
      schema:
        type: string
      description: Optional name to search in applications
      required: false
    orderParameter:
      name: order
      in: query
      description: The sort order
      required: false
      schema:
        $ref: '#/components/schemas/Order'
    parameters-idParameter:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^0AG[0-9A-HJKMNP-TV-Z]{26}$
      description: Application Group ID.
    parameters-sortParam:
      in: query
      name: sort
      description: The field to sort by
      required: false
      schema:
        type: string
        enum:
        - application_group.id
        - application_group.name
        - application_group.create_time
        - application_group.update_time
    sortParam:
      in: query
      name: sort
      description: The field to sort by
      required: false
      schema:
        type: string
        enum:
        - application.id
        - application.name
        - application.create_time
        - application.update_time
    typeParameter:
      in: path
      name: type
      required: true
      schema:
        type: string
        enum:
        - custom
        - private
        - non-web
        - catalog
        - localdesktopcustom
    urlParameter:
      in: query
      name: url
      schema:
        type: string
      description: Optional URL to search in applications
      required: false
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              errorResponse:
                $ref: '#/components/schemas/ErrorResponse'
    BulkCreated:
      description: Created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkCreatedResponse'
    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              errorResponse:
                $ref: '#/components/schemas/ErrorResponse'
    Created:
      description: Created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The ID of the newly created resource
            required:
            - id
    Deleted:
      description: Deleted successfully
    Forbidden:
      description: Forbidden
    InternalServerError:
      description: Internal server error
    NotFound:
      description: Resource Not found
    Updated:
      description: Updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The ID of the updated resource
            required:
            - id
  schemas:
    AccessAndDataRuleDetailed:
      description: A detailed access-and-data rule object with complete configuration
      type: object
      required:
      - id
      - name
      - priority
      - mode
      - scope
      - metadata
      properties:
        id:
          type: string
          description: Unique identifier for the rule
        name:
          type: string
          description: User-friendly name for the rule
        priority:
          type: integer
          format: int32
          description: Order position of the rule in the list
        section:
          type: object
          nullable: true
          description: Section this rule belongs to (null if standalone)
          allOf:
          - $ref: '#/components/schemas/SectionRef'
        description:
          type: string
          description: Detailed explanation of the rule's purpose
        mode:
          $ref: '#/components/schemas/AccessAndDataRuleMode'
        scope:
          $ref: '#/components/schemas/GetScope'
        metadata:
          type: object
          required:
          - createdBy
          - createdTime
          - lastUpdatedBy
          - lastUpdatedTime
          properties:
            configurationVersion:
              $ref: '#/components/schemas/MetadataConfigurationVersion'
            createdBy:
              type: string
              description: Email or identifier of the admin who created the rule
            createdTime:
              type: string
              format: date-time
              description: Timestamp when the rule was created
            lastUpdatedBy:
              type: string
              description: Email or identifier of the admin who last updated the rule
            lastUpdatedTime:
              type: string
              format: date-time
              description: Timestamp when the rule was last updated
    AccessAndDataRuleMode:
      type: string
      description: The mode of the rule.
      enum:
      - active
      - monitor
      - disabled
    AddRemoveApps:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
            pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 2000
        remove:
          type: array
          items:
            type: string
            pattern: ^0AP[0-9A-HJKMNP-TV-Z]{26}$
          maxItems: 2000
    AddRemoveCidrs:
      type: object
      description: Add or remove CIDRs from a private application.
      properties:
        add:
          type: array
          items:
            type: string
          maxItems: 100
        remove:
          type: array
          items:
            type: string
    AddRemoveUrls:
      type: object
      description: Add or remove URLs from an application. The total URL count after modification cannot exceed 100.
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
          maxItems: 100
        remove:
          type: array
          items:
            $ref: '#/components/schemas/UrlInput'
    AllowBlockControl:
      type: object
      nullable: true
      description: A simple control with an allow or block action. Re-usable by any data control that only needs a binary allow/block decision.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: The action for this control.
          enum:
          - allow
          - block
    AllowedOrBlockedExtensionsControl:
      type: object
      nullable: true
      description: Control browser extension availability to users based on extension ID or risk score.
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          description: Operating mode for Allowed or Blocked Extensions. When multiple rules match a user, higher-priority allowAll or blockAll rules override lower-priority extension rules, and allowByList allows only the listed extensions.
          enum:
          - allowAll
          - blockAll
          - allowByList
          - blockByListOrRisk
        extensions:
          type: array
          description: List of Chrome extension entries to allow or block.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AllowedOrBlockedExtensionEntry'
        riskLevel:
          type: string
          description: Risk level threshold.
          enum:
          - malicious
          - medium
          - high
    AllowedPrintersControl:
      type: object
      nullable: true
      description: Control which printers can be used when printing from Prisma Browser.
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          description: Whether any printer is allowed or only specific printers from a list.
          enum:
          - allowAny
          - allowSpecific
        allowedPrinters:
          type: array
          description: Printer identifiers allowed when action is 'allowSpecific'.
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        allowSaveAsPdf:
          type: boolean
          default: true
          description: Whether to allow 'Save as PDF' when action is 'allowSpecific'. Dashboard shows this behind showSaveAsPdfCheckbox.
    ApiError:
      description: Unified error response for all API endpoints
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - timestamp
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - CONTIGUITY_VIOLATION
              - INCOMPLETE_ARRAY
              - NOT_FOUND
              - FORBIDDEN
              - CONFLICT
              - INTERNAL_ERROR
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              description: Detailed error information
              items:
                type: object
                properties:
                  index:
                    type: integer
                    description: 0-based index of the failing move in the request array
                  field:
                    type: string
                    description: JSON path of the offending field (e.g. target.anchor.id)
                  error:
                    type: string
                  value:
                    type: string
                  sectionId:
                    type: string
                  ruleId:
                    type: string
                  ruleIds:
                    type: array
                    items:
                      type: string
                  missingRules:
                    type: array
                    items:
                      type: string
                  missingSections:
                    type: array
                    items:
                      type: string
                additionalProperties: false
            timestamp:
              type: string
              format: date-time
              description: When the error occurred
          additionalProperties: false
      additionalProperties: false
    ApplicationGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Name of the application group
        description:
          type: string
          description: Description of the application group
        applications:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier
              name:
                type: string
                description: Name of the application
              type:
                type: string
                description: The type of the application
                enum:
                - catalog
                - custom
                - private
                - non-web
                - user-non-web
                - pra
                - desktop
            required:
            - id
            - name
            - type
          description: IDs of the group members
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - id
      - name
      - metadata
    ApplicationItem:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CustomApplication'
      - $ref: '#/components/schemas/PrivateApplication'
      - $ref: '#/components/schemas/NonWebApplication'
      - $ref: '#/components/schemas/CatalogApplication'
      - $ref: '#/components/schemas/LocalDesktopApplication'
      discriminator:
        propertyName: type
        mapping:
          custom: '#/components/schemas/CustomApplication'
          private: '#/components/schemas/PrivateApplication'
          non-web: '#/components/schemas/NonWebApplication'
          catalog: '#/components/schemas/CatalogApplication'
          localdesktopcustom: '#/components/schemas/LocalDesktopApplication'
    ApplicationTypeInput:
      type: string
      enum:
      - custom
      - private
      - non-web
      - localdesktopcustom
    AttributeObject:
      type: object
      properties:
        screenLock:
          type: object
          description: Check if the device has automatic screen lock enabled
          properties:
            negate:
              type: boolean
              default: false
              description: Whether to negate this attribute
            enabled:
              type: boolean
              description: Whether this attribute is enabled
          required:
          - enabled
        endpointProtection:
          type: object
          description: Check if the device has endpoint protection software installed and running
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            selectedVendors:
              type: array
              items:
                $ref: '#/components/schemas/EppVendorName'
              description: Selected endpoint protection vendors to check for
            lastDefinitionUpdate:
              $ref: '#/components/schemas/LastDefinitionUpdateAttribute'
          required:
          - enabled
        firewall:
          type: object
          description: Check if the device has firewall protection installed and running
          properties:
            negate:
              type: boolean
              default: false
              description: Whether to negate this attribute
            enabled:
              type: boolean
              description: Whether this attribute is enabled
            anyVendor:
              type: boolean
              description: Whether to accept any firewall vendor
            specificVendors:
              type: array
              items:
                $ref: '#/components/schemas/FirewallVendorName'
              description: Selected firewall vendors to check for
          required:
          - enabled
        diskEncryption:
          type: object
          description: Check if the device has disk encryption software installed and running
          properties:
            negate:
              type: boolean
              default: false
              description: Whether to negate this attribute
            enabled:
              type: boolean
              description: Whether this attribute is enabled
            anyVendor:
              type: boolean
              description: Whether to accept any disk encryption vendor
            specificVendors:
              type: array
              items:
                $ref: '#/components/schemas/DiskEncryptionVendorName'
              description: Selected disk encryption vendors to check for
          required:
          - enabled
        osVersion:
          type: object
          description: Check if the device is running a specific operating system version
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            windows:
              $ref: '#/components/schemas/WindowsVersionAttribute'
            macOS:
              $ref: '#/components/schemas/MacOSVersionAttribute'
            linux:
              $ref: '#/components/schemas/LinuxVersionAttribute'
          required:
          - enabled
        serialNumber:
          type: object
          description: Check if the device's serial number is included in the provided list
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            serials:
              type: array
              items:
                type: string
              description: List of device serial numbers to check for
          required:
          - enabled
        clientCertificate:
          type: object
          description: Check if the device's client certificate is signed by the provided issuer certificate
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            issuerCertificates:
              type: array
              items:
                $ref: '#/components/schemas/IssuerCertificate'
              description: List of trusted issuer certificates to validate against
          required:
          - enabled
        deviceType:
          type: object
          description: Check if the device matches specific device types (e.g., desktop, laptop, virtual machine)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            types:
              type: array
              items:
                $ref: '#/components/schemas/DeviceType'
              description: List of device types to check for
          required:
          - enabled
        csZtaScore:
          type: object
          description: "Check if the device meets minimum CrowdStrike Zero Trust Assessment score requirements. \nIf multiple score types are provided (basicScore, overallScore, breakdownScores), the latest one will be used.\n"
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            basicScore:
              $ref: '#/components/schemas/CsZtaBasicScoreLevel'
            overallScore:
              $ref: '#/components/schemas/CsZtaScore'
            breakdownScores:
              type: object
              description: Breakdown scores with separate OS and sensor score ranges for granular validation.
              properties:
                osScore:
                  $ref: '#/components/schemas/CsZtaScore'
                sensorScore:
                  $ref: '#/components/schemas/CsZtaScore'
              required:
              - osScore
              - sensorScore
            customerIds:
              type: array
              items:
                type: string
              description: CrowdStrike customer IDs to validate
          required:
          - enabled
        mobileRootJailBreakStatus:
          type: object
          description: Check if the mobile device has been rooted (Android) or jailbroken (iOS)
          properties:
            enabled:
              type: boolean
          required:
          - enabled
        mobileScreenLock:
          type: object
          description: Check if the mobile device has screen lock protection enabled
          properties:
            enabled:
              type: boolean
          required:
          - enabled
        mobileDeviceManufacturers:
          type: object
          description: Check if the mobile device is from specific manufacturers (e.g., Apple, Samsung)
          properties:
            enabled:
              type: boolean
            vendors:
              type: array
              items:
                $ref: '#/components/schemas/MobileManufacturer'
              description: List of mobile device manufacturers to check for
          required:
          - enabled
        mobileOsVersion:
          type: object
          description: Check if the mobile device is running a specific iOS or Android version
          properties:
            enabled:
              type: boolean
            ios:
              $ref: '#/components/schemas/MobileOsVersion'
            android:
              $ref: '#/components/schemas/MobileOsVersion'
          required:
          - enabled
        mobileDeviceType:
          type: object
          description: Check if the mobile device matches specific types (e.g., phone, tablet)
          properties:
            enabled:
              type: boolean
            types:
              type: array
              items:
                $ref: '#/components/schemas/MobileDeviceType'
              description: List of mobile device types to check for
          required:
          - enabled
        mobileDeviceManagement:
          type: object
          description: Check if the mobile device is managed by specific mobile device management systems
          properties:
            enabled:
              type: boolean
            systems:
              type: array
              items:
                $ref: '#/components/schemas/MobileDeviceManagementSystem'
              description: Mobile device management system configurations
          required:
          - enabled
        osPassword:
          type: object
          description: Check if the device has an OS authentication password configured with specific requirements
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            complexity:
              $ref: '#/components/schemas/OsPasswordComplexity'
            maxAge:
              type: integer
              description: Maximum password age in days
            minLength:
              type: integer
              description: Minimum password length in characters
          required:
          - enabled
        normalOSBootMode:
          type: object
          description: Check if a device is running in OS normal boot mode (not safe mode, recovery mode or a pre-installation environment)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
        privilegedProcess:
          type: object
          description: Include only devices on which Prisma Browser is running with elevated/root permissions
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
        deviceManufacturer:
          type: object
          description: Check if the device is from specific manufacturers (e.g., Dell, HP, Lenovo)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            selectedVendors:
              type: array
              items:
                $ref: '#/components/schemas/SelectedDeviceVendor'
              description: List of device manufacturers with optional specific models to check for
          required:
          - enabled
        deviceManagement:
          type: object
          description: Check if the device is managed by specific device management systems (e.g., Microsoft Intune, Jamf, Active Directory)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            systems:
              type: array
              items:
                $ref: '#/components/schemas/DeviceManagementSystemInput'
              description: Device management system configurations
          required:
          - enabled
        systemIntegrity:
          type: object
          description: Check if the device has advanced system integrity protection enabled
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
        browserBrand:
          type: object
          description: Check if the device has specific browser brands and versions installed
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            brands:
              type: array
              items:
                $ref: '#/components/schemas/BrowserBrandDetails'
              description: Browser brand and version requirements
          required:
          - enabled
        remoteConnection:
          type: object
          description: Check if the device has an active remote connection (RDP, Citrix ICA, etc.)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
        registry:
          type: object
          description: Check if the device has all of the specified registry key configurations (Windows only)
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            regKeys:
              type: array
              items:
                $ref: '#/components/schemas/RegKey'
              description: Registry key configurations to validate
          required:
          - enabled
        locationServices:
          type: object
          description: Check if the device's location services can be accessed by Prisma Browser
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
        runningProcesses:
          type: object
          description: Check if the device has all of the specified processes running
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            win:
              type: array
              items:
                $ref: '#/components/schemas/WinRunningProcessMetadata'
              description: Windows process requirements to check for
            macOS:
              type: array
              items:
                $ref: '#/components/schemas/MacOSRunningProcessMetadata'
              description: macOS process requirements to check for
          required:
          - enabled
        fileExistence:
          type: object
          description: Check if the device has all of the specified files present
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
            win:
              type: array
              items:
                $ref: '#/components/schemas/WinFileExistenceMetadata'
              description: Windows file paths to check for existence
            macOS:
              type: array
              items:
                $ref: '#/components/schemas/MacOSFileExistenceMetadata'
              description: macOS file paths to check for existence
          required:
          - enabled
        browserEol:
          type: object
          description: Check if the device has browser versions that are end-of-life
          properties:
            negate:
              type: boolean
              default: false
            enabled:
              type: boolean
          required:
          - enabled
      additionalProperties: false
    AuthenticationFactorControl:
      nullable: true
      description: The authentication factor is used to unlock the browser, or for step-up MFA.
      oneOf:
      - $ref: '#/components/schemas/AuthenticationFactorPinCodeControl'
      - $ref: '#/components/schemas/AuthenticationFactorPasskeyControl'
      - $ref: '#/components/schemas/AuthenticationFactorIdentityProviderControl'
      discriminator:
        propertyName: method
        mapping:
          pinCode: '#/components/schemas/AuthenticationFactorPinCodeControl'
          passkey: '#/components/schemas/AuthenticationFactorPasskeyControl'
          identityProvider: '#/components/schemas/AuthenticationFactorIdentityProviderControl'
    AuthenticationFactorIdentityProviderControl:
      type: object
      description: Identity provider authentication factor settings.
      additionalProperties: false
      required:
      - method
      - identityProvider
      properties:
        method:
          type: string
          description: Method used for browser unlock and step-up MFA.
          enum:
          - identityProvider
        identityProvider:
          type: object
          description: Identity provider settings.
          additionalProperties: false
          properties:
            profileSource:
              type: string
              description: Whether to use the configured authentication profile or specify a custom one.
              enum:
              - useConfiguredAuthProfile
              - custom
              default: useConfiguredAuthProfile
            authProfileId:
              type: string
              description: Authentication profile ID to use when profileSource is 'custom'.
              minLength: 1
              maxLength: 128
            incognito:
              type: boolean
              description: Whether to perform IdP authentication in an isolated browser session.
              default: true
            forceReauthentication:
              type: boolean
              description: Whether to force re-authentication with the IdP rather than using an existing session.
              default: true
    AuthenticationFactorPasskeyControl:
      type: object
      description: Passkey authentication factor settings.
      additionalProperties: false
      required:
      - method
      - passkey
      properties:
        method:
          type: string
          description: Method used for browser unlock and step-up MFA.
          enum:
          - passkey
        passkey:
          type: object
          description: Passkey authenticator settings.
          additionalProperties: false
          required:
          - internalAuthenticator
          - externalAuthenticator
          properties:
            internalAuthenticator:
              type: boolean
              description: Allow passkeys from device-bound authenticators such as Windows Hello or macOS Keychain.
            externalAuthenticator:
              type: boolean
              description: Allow passkeys from external authenticators such as Yubikey, smartcard, or mobile phone.
    AuthenticationFactorPinCodeControl:
      type: object
      description: PIN code authentication factor settings.
      additionalProperties: false
      required:
      - method
      - pinCode
      properties:
        method:
          type: string
          description: Method used for browser unlock and step-up MFA.
          enum:
          - pinCode
        pinCode:
          type: object
          description: PIN code settings.
          additionalProperties: false
          properties:
            minLength:
              type: integer
              description: Required PIN length.
              minimum: 4
              maximum: 6
              default: 4
            maxFailedAttempts:
              type: integer
              description: Maximum failed PIN attempts before the user is locked out. Use 0 for unlimited.
              enum:
              - 0
              - 1
              - 2
              - 5
              - 15
              - 20
              - 30
              default: 5
    AuthenticationServerAllowlistControl:
      type: object
      nullable: true
      description: List the servers allowed to use Integrated Authentication.
      additionalProperties: false
